name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
