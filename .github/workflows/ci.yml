name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: SmartVibe final-decision firewall tests
        run: npm run test:smartvibe-firewall
      - name: Expo configuration and dependency health
        run: npx expo-doctor
      - name: Production web export
        run: npm run export:web
      - name: Typecheck Supabase live functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate live Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/live-execute/index.ts supabase/functions/consensus-signals/index.ts
      - name: Validate MT5 bridge source
        run: python -m py_compile mt5-bridge/app.py
      - name: Validate MT5 cloud bootstrap scripts
        run: |
          bash -n mt5-bridge/cloud/oracle/bootstrap.sh
          bash -n mt5-bridge/cloud/oracle/install-cloudflared.sh
          grep -q 'uname -m' mt5-bridge/cloud/oracle/bootstrap.sh
          grep -q 'x86_64' mt5-bridge/cloud/oracle/bootstrap.sh
          grep -q 'MT5_ALLOW_READ_ONLY=true' mt5-bridge/cloud/oracle/bootstrap.sh
          grep -q '127.0.0.1:8787' mt5-bridge/cloud/oracle/bootstrap.sh
          grep -q 'cloudflared tunnel' mt5-bridge/cloud/oracle/install-cloudflared.sh
      - name: Verify universal market-data contract
        run: |
          grep -q "export type NormalizedMarketBar" lib/engine/market-data.ts
          grep -q "marketType" lib/engine/market-data.ts
          grep -q "timezone: 'UTC'" lib/engine/market-data.ts
          grep -q "lookAheadDetected" lib/engine/market-data.ts
      - name: Verify non-leveraged accumulation boundary
        run: |
          grep -q "mode: 'ACCUMULATION_PLAN'" lib/engine/spot-accumulation.ts
          grep -q "requiresSmartVibeAuthorization: true" lib/engine/spot-accumulation.ts
          if grep -nE "placeOrder|execute\(|LiveExecutionRequest|BrokerAdapter" lib/engine/spot-accumulation.ts; then
            echo "Spot accumulation planning must not execute leveraged/live orders."
            exit 1
          fi
      - name: Verify MT5 bridge security contract
        run: |
          grep -q 'docs_url=None' mt5-bridge/app.py
          grep -q 'redoc_url=None' mt5-bridge/app.py
          grep -q 'if not TOKEN:' mt5-bridge/app.py
          grep -q 'if ALLOW_READ_ONLY:' mt5-bridge/app.py
          grep -q 'api.order_check' mt5-bridge/app.py
          grep -q 'api.order_send' mt5-bridge/app.py
          grep -q '@APP.patch("/position/{ticket}")' mt5-bridge/app.py
          grep -q '@APP.delete("/order/{ticket}")' mt5-bridge/app.py
          grep -q '@APP.post("/position/{ticket}/close")' mt5-bridge/app.py
          grep -q '@APP.get("/execution/{ticket}")' mt5-bridge/app.py
      - name: Verify supporting mechanism boundary
        run: |
          if grep -RInE "from ['\"].*smartvibe/(methodology|core)|import .*smartvibe/(methodology|core)" smartvibe/adapters smartvibe/mechanics smartvibe/intelligence smartvibe/decision 2>/dev/null; then
            echo "Supporting mechanisms must not import or mutate SmartVibe methodology/core modules."
            exit 1
          fi
      - name: Verify customer-facing identity
        run: |
          if grep -RInE "KillaXBT|Ezra|BlueZone|TradingAgents|ForexTreeSwarm|QuantDinger|NautilusTrader|LEAN|ChartScanAI|AI-Trader|Gifted87|EA31337|OpenBB|yfinance|OANDA|Alpaca|FXCM" app components context lib 2>/dev/null; then
            echo "External methodology/provider names must not leak into customer-facing application code."
            exit 1
          fi
