name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Expo configuration and dependency health
        run: npx expo-doctor
      - name: Production web export
        run: npm run export:web
      - name: Typecheck Supabase live functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate live Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/live-execute/index.ts supabase/functions/consensus-signals/index.ts
      - name: Verify supporting mechanism boundary
        run: |
          if grep -RInE "from ['\"].*smartvibe/(methodology|core)|import .*smartvibe/(methodology|core)" smartvibe/adapters smartvibe/mechanics smartvibe/intelligence smartvibe/decision 2>/dev/null; then
            echo "Supporting mechanisms must not import or mutate SmartVibe methodology/core modules."
            exit 1
          fi
      - name: Verify customer-facing identity
        run: |
          if grep -RInE "KillaXBT|TradingAgents|ForexTreeSwarm|QuantDinger|NautilusTrader|ChartScanAI|AI-Trader|Gifted87|EA31337|OpenBB|yfinance|OANDA|Alpaca|FXCM" app components context lib 2>/dev/null; then
            echo "External methodology/provider names must not leak into customer-facing application code."
            exit 1
          fi
