name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist normalized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already aligned"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: align package lockfile with Expo dependencies"
            git push
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Expo configuration and dependency health
        run: npx expo-doctor
