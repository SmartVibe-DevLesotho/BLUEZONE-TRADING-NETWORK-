name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Expo configuration and dependency health
        run: npx expo-doctor
