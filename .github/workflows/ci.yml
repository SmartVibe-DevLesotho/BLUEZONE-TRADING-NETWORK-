name: SmartVibe CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify package lockfile
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Expo configuration and dependency health
        run: npx expo-doctor
      - name: Typecheck Supabase live functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate live Edge Functions
        run: deno check supabase/functions/live-execute/index.ts supabase/functions/consensus-signals/index.ts
      - name: Verify hidden mechanics boundary
        run: |
          if grep -RInE "from ['\"].*smartvibe/(methodology|core)|import .*smartvibe/(methodology|core)" smartvibe/adapters smartvibe/mechanics smartvibe/intelligence smartvibe/decision 2>/dev/null; then
            echo "External mechanics must not import or mutate SmartVibe methodology/core modules."
            exit 1
          fi
